<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SLUGS · Followers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060606}
a{color:#f5f3ee;text-decoration:none}a:hover{color:#f8622e}
@keyframes cardIn{0%{opacity:0;transform:translateY(24px) scale(0.96)}60%{opacity:1;transform:translateY(-3px) scale(1.005)}100%{opacity:1;transform:none}}
</style>
</helmet>
<div style="min-height: 900px; background: #060606; color: #f5f3ee; font-family: Inter, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 16px; min-height: 44px; padding: 0 14px; border-bottom: 1px solid #141413; opacity: 0.35">
    <img src="../../../../web/public/slugs-logo-orange.png" alt="SLUGS" style="height: 14px; width: auto; image-rendering: pixelated">
    <span style="font-size: 13px; color: #9a978f">Profile</span>
  </header>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px">
    <div role="dialog" aria-label="Followers and following" style="width: 100%; max-width: 520px; max-height: 720px; display: flex; flex-direction: column; border: 1px solid #2f2d29; border-radius: 18px; background: #111110; box-shadow: 0 40px 100px rgba(0,0,0,0.75); overflow: hidden; animation: cardIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 16px; border-bottom: 1px solid #1f1e1c">
        <div role="tablist" aria-label="List" style="display: flex; gap: 2px">
          <button type="button" role="tab" aria-selected="{{followersOn}}" onClick="{{showFollowers}}" style="font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; border: 0; background: {{followersBg}}; color: {{followersColor}}; cursor: pointer">Followers <span style="font-family: Inter, -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 11px; color: #85827a">12</span></button>
          <button type="button" role="tab" aria-selected="{{followingOn}}" onClick="{{showFollowing}}" style="font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; border: 0; background: {{followingBg}}; color: {{followingColor}}; cursor: pointer">Following <span style="font-family: Inter, -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 11px; color: #85827a">7</span></button>
        </div>
        <button type="button" aria-label="Close" title="Close" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 0; background: #1a1918; color: #b8b5ad; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div style="padding: 10px 12px; border-bottom: 1px solid #1f1e1c">
        <label for="f-search" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid #1f1e1c; border-radius: 8px; background: #0b0b0a; color: #85827a">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="f-search" placeholder="Search @usernames" aria-label="Search @usernames" style="flex: 1; font: inherit; font-size: 13px; border: 0; outline: 0; background: transparent; color: #f5f3ee">
        </label>
      </div>
      <div style="overflow: auto; padding: 4px 0">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="8">
          <div style="display: flex; align-items: center; gap: 12px; padding: 9px 16px">
            <span style="width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1.5px solid {{p.ring}}; color: {{p.ring}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">{{p.initial}}</span>
            <span style="flex: 1; min-width: 0">
              <span style="display: block; font-size: 14px; font-weight: 600">@{{p.handle}}</span>
              <sc-if value="{{p.name}}" hint-placeholder-val="{{ false }}"><span style="display: block; font-size: 12px; color: #85827a">{{p.name}}</span></sc-if>
            </span>
            <span style="display: flex; gap: 2px">
              <button type="button" aria-label="Copy username" title="Copy @username" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 7px; background: transparent; color: #9a978f; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="3"></rect><path d="M16 8V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v7a3 3 0 0 0 3 3h2"></path></svg></button>
              <a href="Chat.dc.html" aria-label="Message" title="Message" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 7px; color: #9a978f"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></a>
              <a href="Activity.dc.html" aria-label="Open profile" title="Open profile" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 7px; color: #9a978f"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
            </span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'followers' };
  }
  renderVals() {
    var self = this;
    var rings = ['#fbbf24', '#2fd39a', '#a78bfa', '#a78bfa', '#a78bfa', '#2fd39a', '#f8622e', '#a78bfa', '#60a5fa'];
    function list(rows) {
      return rows.map(function (r, i) { return { handle: r[0], name: r[1], initial: r[0].charAt(0).toUpperCase(), ring: rings[i % rings.length] }; });
    }
    var followers = list([['ponyboy', ''], ['mememarketer', 'mememarketer'], ['proton', ''], ['velveteen', ''], ['lacreators', ''], ['app', ''], ['marketer', 'Gabriel Kenworthy'], ['your_slug', ''], ['agent', 'Gabriel Kenworthy']]);
    var following = list([['ponyboy', ''], ['velveteen', ''], ['lacreators', ''], ['marketer', 'Gabriel Kenworthy'], ['abstract', ''], ['agent', 'Gabriel Kenworthy'], ['ryan', '']]);
    var on = this.state.tab === 'followers';
    return {
      people: on ? followers : following,
      followersOn: on ? 'true' : 'false',
      followingOn: on ? 'false' : 'true',
      followersBg: on ? '#1f1e1c' : 'transparent',
      followingBg: on ? 'transparent' : '#1f1e1c',
      followersColor: on ? '#f5f3ee' : '#9a978f',
      followingColor: on ? '#9a978f' : '#f5f3ee',
      showFollowers: function () { self.setState({ tab: 'followers' }); },
      showFollowing: function () { self.setState({ tab: 'following' }); }
    };
  }
}
</script>
</body>
</html>
